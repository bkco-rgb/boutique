<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personnalisation de Coque</title>
  <style>
    /* --- STYLES GENERAUX --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .customizer-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      max-width: 1000px;
      width: 100%;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    /* --- PANNEAU DE COMMANDE (GAUCHE) --- */
    .controls-panel {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .step-group {
      background: #fafafa;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #eaeaea;
    }

    .step-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #2c3e50;
    }

    select, input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="file"]:focus {
      border-color: #3498db;
    }

    .section-hidden {
      display: none;
    }

    .section-reveal {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .summary-box {
      margin-top: 10px;
      padding: 12px;
      background: #e8f4fc;
      border-left: 4px solid #3498db;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    /* --- PANNEAU SIMULATION (DROITE) --- */
    .preview-panel {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
      border-radius: 8px;
      padding: 20px;
    }

    .sim-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px; /* Ratio 1:2 basé sur 800x1600 */
      aspect-ratio: 1 / 2;
      background: #e0e0e0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sim-hint {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #666;
      text-align: center;
    }

    .sim-loading {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="customizer-container">
  
  <!-- PANNEAU DE CONFIGURATION -->
  <div class="controls-panel">
    <h2>Personnalisez votre coque</h2>
    
    <!-- ÉTAPE 1 : Choix du modèle -->
    <div class="step-group">
      <div class="step-title">1. Choisissez votre modèle</div>
      <select id="phoneModel" onchange="revelerEtape2()">
        <option value="">-- Sélectionnez un modèle --</option>
        <option value="iPhone 15 Pro">iPhone 15 Pro</option>
        <option value="iPhone 16 Pro">iPhone 16 Pro</option>
        <option value="Samsung Galaxy S24">Samsung Galaxy S24</option>
      </select>
    </div>

    <!-- ÉTAPE 2 : Importation de photo -->
    <div id="step2" class="step-group section-hidden">
      <div class="step-title">2. Ajoutez votre photo</div>
      <input type="file" id="photoInput" accept="image/*" onchange="traiterPhoto(event)">
    </div>

    <!-- RÉSUMÉ & PRIX -->
    <div id="summaryBox" class="summary-box section-hidden">
      <p>Modèle sélectionné : <strong id="summaryModel">-</strong></p>
      <p>Prix : <strong id="summaryPrice">19,99 €</strong></p>
    </div>
  </div>

  <!-- PANNEAU D'APERÇU CANVAS -->
  <div class="preview-panel">
    <div id="simLoading" class="sim-loading"></div>
    <div id="simWrapper" class="sim-wrapper" style="display: none;">
      <canvas id="simCanvas" width="800" height="1600"></canvas>
    </div>
    <div id="simHint" class="sim-hint"></div>
  </div>

</div>

<script>
  // STATE GLOBAL DE LA SIMULATION
  const simState = {
    model: null,
    caseImg: null,  // Calque transparent de la coque
    photo: null,    // Image téléchargée par l'utilisateur
    box: null
  };

  // Cache pour éviter de recharger les coques déjà téléchargées
  const simDetectCache = {};

  // Convertit le nom du modèle en nom de fichier webp propre (ex: "iPhone 15 Pro" -> "iphone-15-pro")
  function slugModel(str) {
    return str
      .toLowerCase()
      .trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/[\s_-]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  // 1. Appelée au changement de modèle dans le menu déroulant
  function revelerEtape2() {
    const model = document.getElementById('phoneModel').value;
    if (model) { 
      simState.model = model;
      document.getElementById('step2').classList.add('section-reveal'); 
      
      // Mise à jour de la boîte de résumé
      document.getElementById('summaryModel').textContent = model;
      document.getElementById('summaryBox').classList.add('section-reveal');
      
      // Réinitialise l'overlay coque tout en GARDANT la photo
      initApercuVide(); 
    }
  }

  // 2. Prépare le chargement de la coque sans réinitialiser la photo client
  function initApercuVide() {
    simState.caseImg = null; 
    simState.box = null;
    
    // REMARQUE CLEF : On ne remet PAS simState.photo à null ici !
    
    const modele = document.getElementById('phoneModel').value;
    if (!modele) return;
    
    const slug = slugModel(modele);
    // Assurez-vous d'avoir vos images "iphone-15-pro.webp" etc. dans le même dossier
    chargerCoque(slug + '.webp', slug);
  }

  // 3. Charge l'image de masque/overlay du modèle de téléphone
  function chargerCoque(caseUrl, slug) {
    const simWrapper = document.getElementById('simWrapper');
    const loadingEl = document.getElementById('simLoading');

    loadingEl.textContent = "Chargement du modèle...";

    function afficherAvecBox(img, box) {
      simState.caseImg = img;
      simState.box = box;
      simWrapper.style.display = 'block';
      loadingEl.textContent = '';
      
      // Texte d'aide dynamique
      if (simState.photo) {
        document.getElementById('simHint').textContent = "✨ Aperçu ajusté automatiquement pour " + simState.model;
      } else {
        document.getElementById('simHint').textContent = "👇 Sélectionnez une photo ci-contre pour la placer sur la coque";
      }
      
      dessinerSim();
    }

    if (simDetectCache[slug]) {
      afficherAvecBox(simDetectCache[slug].img, simDetectCache[slug].box);
      return;
    }

    const img = new Image();
    img.onload = () => {
      const box = detecterZonePhoto(img);
      simDetectCache[slug] = { img, box };
      afficherAvecBox(img, box);
    };
    img.onerror = () => {
      loadingEl.textContent = '';
      console.warn('Image de coque non trouvée pour :', caseUrl);
      // Fallback si l'image .webp n'existe pas encore
      afficherAvecBox(null, null);
    };
    img.src = caseUrl;
  }

  // 4. Détection simplifiée de la zone utile (Marge fixe de sécurité)
  function detecterZonePhoto(img) {
    return {
      insetX: 800 * 0.025, // 2.5% marge horizontale
      insetY: 1600 * 0.025 // 2.5% marge verticale
    };
  }

  // 5. Lecture et conversion de la photo uploadée
  function traiterPhoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        simState.photo = img; // Sauvegarde dans le state global
        
        if (simState.model) {
          document.getElementById('simHint').textContent = "✨ Aperçu généré avec succès !";
        }
        dessinerSim();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 6. MOTEUR DU CANVAS : Redessine la photo + le masque arrondi + la coque
  function dessinerSim() {
    const canvas = document.getElementById('simCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    // Réinitialisation de la grille canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- A. DESSINER ET MASQUER LA PHOTO DU CLIENT ---
    if (simState.photo) {
      ctx.save();

      // Paramètres de découpe (800x1600, Coins arrondis à 13%, Inset 2.5%)
      const insetX = canvas.width * 0.025;  // 20px
      const insetY = canvas.height * 0.025; // 40px
      const w = canvas.width - (insetX * 2);
      const h = canvas.height - (insetY * 2);
      const radius = Math.min(w, h) * 0.13; // ~98px de rayon de coin

      // Tracé du masque arrondi
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(insetX, insetY, w, h, radius);
      } else {
        ctx.rect(insetX, insetY, w, h); // Fallback navigateurs très anciens
      }
      ctx.clip(); // Limite le dessin à l'intérieur de la forme

      // Calcul du ratio pour afficher la photo en "Cover" (remplissage proportionnel)
      const img = simState.photo;
      let drawW = canvas.width;
      let drawH = canvas.height;
      let offsetX = 0;
      let offsetY = 0;

      const imgRatio = img.width / img.height;
      const canvasRatio = canvas.width / canvas.height;

      if (imgRatio > canvasRatio) {
        drawH = canvas.height;
        drawW = canvas.height * imgRatio;
        offsetX = (canvas.width - drawW) / 2;
      } else {
        drawW = canvas.width;
        drawH = canvas.width / imgRatio;
        offsetY = (canvas.height - drawH) / 2;
      }

      // Dessin de la photo importée
      ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
      ctx.restore();
    } else {
      // Fond neutre par défaut si pas encore de photo
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // --- B. SUPERPOSER LA COQUE TRANSPARENTE (Contour & Bloc caméra) ---
    if (simState.caseImg) {
      ctx.drawImage(simState.caseImg, 0, 0, canvas.width, canvas.height);
    }
  }
</script>

</body>
</html>
